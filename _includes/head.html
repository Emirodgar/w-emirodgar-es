<head>
  <title>{{ page.title }}</title>

  <!-- Meta -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description |default: "Impulsando las estratégias políticas con tecnología avanzada" }}">
  <link rel="canonical" href="https://emirodgar.es{{ page.url }}" />
  {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}

  <!-- Favicon -->
  <link rel="shortcut icon" href="https://emirodgar.com/cdn/images/hash.png">

  <!-- Modo oscuro: se aplica antes de pintar para evitar el parpadeo -->
  <script>try{if(localStorage.getItem("theme")==="dark"){document.documentElement.setAttribute("dark","");document.documentElement.classList.add("dark-mode")}}catch(e){}</script>

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos del tema -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/chrome.css?v=20261028">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css?v=20261028">
  {% include jsonld.html %}
</head>

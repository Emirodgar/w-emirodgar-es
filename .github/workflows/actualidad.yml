name: Hemeroteca diaria (Gemini)

on:
  schedule:
    # Objetivo: a partir de las 7:00 hora de Madrid. GitHub programa en UTC y
    # no conoce el horario de verano (5:00 UTC = 7:00 en verano, 6:00 UTC = 7:00
    # en invierno), así que el paso "Comprobar hora" descarta los disparos que
    # caen antes de las 7 en Madrid.
    #
    # GitHub descarta o retrasa horas los triggers de `schedule` (el 6/10 se
    # saltó los tres que había programados, a las 5:07, 6:07 y 7:07 UTC). Por
    # eso hay un disparo cada hora hasta las 12:07 UTC: el primero que GitHub
    # se digne a lanzar tras las 7:00 genera el día, y los siguientes terminan
    # al instante porque el script no repite un día que ya existe ni llama a
    # Gemini. Minuto :07 (no en punto) para evitar la hora de mayor carga.
    - cron: '7 5-12 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Regenerar el resumen de hoy aunque ya exista'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualidad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar hora (solo a partir de las 7:00 de Madrid)
        id: hora
        run: |
          h=$(TZ=Europe/Madrid date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" -lt 7 ]; then
            echo "Son las ${h}h en Madrid: todavía no toca."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Python
        if: steps.hora.outputs.ejecutar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar el resumen del día con Gemini
        id: build
        if: steps.hora.outputs.ejecutar == 'true'
        env:
          # Secret del repo; si se guardó como "variable" de Actions, se
          # recoge igualmente con vars.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: python3 scripts/actualidad/build.py

      - name: Commit y push de lo que haya cambiado
        if: steps.build.outputs.ficheros != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo los ficheros que el script declara haber tocado (nunca add -A).
          git add ${{ steps.build.outputs.ficheros }}
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Actualiza hemeroteca de actualidad (${{ steps.build.outputs.periodo }})"
          git pull --rebase
          git push

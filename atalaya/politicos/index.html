<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Políticos | Atalaya</title>
<meta name="description" content="Quién gobierna hoy y quién se presenta el 29N en cada provincia, con foto, estado y riesgo según la prensa.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://emirodgar.es/atalaya/politicos/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
:root{--bg:#07090d;--panel:#0e1219;--panel2:#131a24;--line:#1f2937;--txt:#e5e9f0;--mut:#8b97a8;--acc:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:inherit}button,select,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;min-height:56px;border-bottom:1px solid var(--line);background:#05070a;position:sticky;top:0;z-index:1000}
.pt{font-size:18px;font-weight:700}.pt small{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
.tagline{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.04em}
.wrap{padding:12px 16px 80px;max-width:1500px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools input,.tools select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.tools input{min-width:240px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel2);border:0;border-right:1px solid var(--line);padding:8px 12px;cursor:pointer;color:var(--mut)}.seg button:last-child{border:0}.seg button.on{background:var(--acc);color:#04222a;font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}.kpi b{display:block;font-family:var(--mono);font-size:24px}.kpi span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.dg{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.pc{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.pc .big{width:64px;height:64px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--mut);background:#0b0f15;overflow:hidden}
.pc .big img{width:100%;height:100%;object-fit:cover}
.pc b{display:block;font-weight:600;line-height:1.25}.pc .rol{color:var(--mut);font-size:13px}
.pc .terr{font-size:12px;color:var(--mut);margin-top:2px}
.risk{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;font-size:12px}.risk .st{font-weight:600}
.bar{flex:1;height:5px;background:#1b2330;border-radius:3px}.bar i{display:block;height:100%;border-radius:3px}
.hl{font-size:12px;margin-top:6px;color:var(--mut)}.hl a{text-decoration:none}.hl a:hover{color:var(--acc)}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}.tb th{position:sticky;top:56px;background:#05070a;color:var(--mut);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none}.tb th.on{color:var(--acc)}.tb tr:hover td{background:var(--panel)}.tbw{overflow-x:auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}.btn:hover{border-color:var(--acc)}
.sp{display:inline-block;vertical-align:middle}.tr{font-family:var(--mono);font-size:11px}
.upd{color:var(--mut);font-size:12px;margin-bottom:10px}
details.g>summary{list-style:none;cursor:pointer}details.g>summary::-webkit-details-marker{display:none}details.g>summary::before{content:'▾ '}details.g:not([open])>summary::before{content:'▸ '}
@media (max-width:800px){.pc{grid-template-columns:48px 1fr;gap:10px;padding:10px}.pc .big{width:48px;height:48px;font-size:15px}}
.mp{margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.mp>summary{cursor:pointer;padding:8px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#map{height:380px;background:#0a0d12;border-top:1px solid var(--line)}.mpl{padding:6px 12px;font-size:12px;color:var(--mut)}.leaflet-container{font-family:Inter,sans-serif}.leaflet-tooltip{background:#05070a;color:var(--txt);border:1px solid var(--line);box-shadow:none}.leaflet-tooltip:before{display:none}
.cmp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:6px;cursor:pointer}
.cbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:1100;display:none;gap:8px;align-items:center;background:#05070a;border:1px solid var(--acc);border-radius:8px;padding:8px 12px;box-shadow:0 4px 20px #000a}.cbar.on{display:flex}
#cmpv{margin-bottom:14px;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:10px;overflow-x:auto}#cmpv table{border-collapse:collapse;width:100%;font-size:13px}#cmpv th,#cmpv td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}#cmpv th{color:var(--mut);font-weight:400;font-family:var(--mono);font-size:11px;text-transform:uppercase;white-space:nowrap}
.fl{color:var(--acc)!important;font-weight:600}
.foot{color:var(--mut);font-size:12px;margin-top:20px;max-width:900px}
.empty{padding:20px;color:var(--mut)}
@media (max-width:800px){.kp{grid-template-columns:repeat(2,1fr)}.tools input{min-width:0;flex:1}}
</style>
</head>
<body>
<script src="/atalaya/assets/shell.js?v=2"></script>
<script src="/atalaya/assets/vendor/leaflet/leaflet.js"></script>
<script src="/atalaya/assets/mapa-bloqueo.js"></script>
<script src="/atalaya/assets/personas.js?v=4"></script>
<header class="top">
  <h1 class="pt">Políticos <small>quién gobierna y quién se presenta</small></h1>
  <span class="tagline">Inteligencia electoral</span>
</header>

<main class="wrap">
  <div class="kp" id="kp" aria-live="polite"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Nombre, partido, cargo, provincia… (t: texto en titulares)" aria-label="Buscar por nombre, partido, cargo o provincia; con t: delante, en titulares" title="Escribe varias palabras para afinar. Con «t:» delante busca en los titulares donde aparece la persona.">
    <select id="ft" aria-label="Territorio"><option value="">Todo el país</option></select>
    <select id="fp" aria-label="Partido"><option value="">Todos los partidos</option></select>
    <select id="fn" aria-label="Nivel"><option value="">Todos los niveles</option><option value="nacional">Nacional</option><option value="autonómico">Autonómico</option><option value="provincial">Diputación</option><option value="municipal">Municipal</option><option value="circ">Cabeza de lista (circunscripción)</option></select>
    <select id="fc" aria-label="Cargo"><option value="">Todos los cargos</option><option value="pres">Presidente/a</option><option value="alc">Alcalde/sa</option><option value="cand">Candidato/a</option></select>
    <select id="fm" aria-label="Tono de la cobertura"><option value="">Cualquier tono</option><option value="neg">Tono negativo</option><option value="neu">Tono neutro</option><option value="pos">Tono positivo</option><option value="nd">Sin datos de tono</option></select>
    <div class="seg" role="group" aria-label="Tipo"><button data-k="" class="on">Todos</button><button data-k="gob">Gobiernan hoy</button><button data-k="cand">Candidatos 29N</button></div>
    <div class="seg" role="group" aria-label="Vista" id="vw"><button data-v="" class="on">Tarjetas</button><button data-v="tabla">Tabla</button></div>
    <button class="btn" id="csv" type="button" title="Descargar la vista filtrada">Exportar CSV</button>
    <select id="fo" aria-label="Orden"><option value="risk">Ordenar por riesgo</option><option value="name">Ordenar por nombre</option><option value="party">Ordenar por partido</option></select>
  </div>
  <div class="upd" id="upd" role="status"></div>
  <div id="cmpv" hidden></div>
  <details class="mp" id="mp"><summary>Mapa de provincias · clic para filtrar</summary><div id="map"></div><div class="mpl" id="mpl"></div></details>
  <div id="out"></div>
  <p class="foot" id="foot"></p>
</main>
<div class="cbar" id="cbar" role="region" aria-label="Comparador"><span id="cn"></span><button class="btn" id="cgo" type="button">Comparar</button><button class="btn" id="cclr" type="button">Vaciar</button></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var norm=function(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
var cleanTitle=function(t){return t.replace(/\s+-\s+[^-]{3,60}$/,'')};
var PE=window.PE,PCOL=PE.PCOL,PNAME=PE.PNAME,PORDER=PE.PORDER,partyKey=PE.partyKey,initials=PE.initials;

var P=[],news=[],prov={},dips={},pvN={},closed={};
var SLUG='alava albacete alicante almeria avila badajoz baleares barcelona burgos caceres cadiz castellon ciudad-real cordoba a-coruna cuenca girona granada guadalajara guipuzcoa huelva huesca jaen leon lleida la-rioja lugo madrid malaga murcia navarra ourense asturias palencia las-palmas pontevedra salamanca santa-cruz-de-tenerife cantabria segovia sevilla soria tarragona teruel toledo valencia valladolid vizcaya zamora zaragoza ceuta melilla'.split(' ');
var slug=function(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};
/* ficha: presidente > diputado (si existe) > ficha de su provincia */
function fichaUrl(p){
  if(p.tipo==='gob'&&p.nacional)return '../fichas/presidente/';
  if(p.nombre&&dips[slug(p.nombre)])return '../fichas/diputado/'+slug(p.nombre)+'/';
  if(p.amb==='autonómico'&&p.provs.length>1)return '';
  var c=p.provs&&p.provs[0],i=c?parseInt(c,10)-1:-1;
  return SLUG[i]?'../fichas/'+SLUG[i]+'/':'';
}

Promise.all([
  fetch('../data/politicos.json').then(function(r){return r.json()}),
  fetch('../data/politicos_prov.json').then(function(r){return r.json()}),
  fetch('../data/noticias.json').then(function(r){return r.json()}),
  fetch('../data/indice.json').then(function(r){return r.json()}),
  fetch('../data/fuentes-propias.json').then(function(r){return r.json()}).catch(function(){return {}}),
  fetch('../data/sentimiento.json').then(function(r){return r.ok?r.json():null}).catch(function(){return null}),
  fetch('../fichas/sitemap.xml').then(function(r){return r.ok?r.text():''}).catch(function(){return ''}),
  fetch('../data/resultados/congreso-2023-07/circunscripciones.json').then(function(r){return r.ok?r.json():null}).catch(function(){return null}),
  fetch('../data/encuestas.json').then(function(r){return r.ok?r.json():null}).catch(function(){return null})
]).then(function(a){
  var nat=a[0].politicos,pp=a[1],ix=a[3];String(a[6]).replace(/fichas\/diputado\/([^\/<]+)\//g,function(m,x){dips[x]=1});news=a[2].noticias;prov=ix.prov;news.forEach(function(n){(n.pv||[]).forEach(function(c){pvN[c]=(pvN[c]||0)+1})});$('upd').innerHTML='Titulares recogidos: '+esc(new Date(a[2].generado).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}))+' · Cargos: Wikidata ('+esc(pp.actualizado||'')+') · Candidatos: Wikipedia';
  if(a[5]&&a[5].items)news.forEach(function(n){var s=a[5].items[n.i];if(s)n.s=s});
  var map={};
  function add(p){
    var k=p.tipo+'|'+(p.wiki||p.nombre||p.slot)+'|'+p.pk,e=map[k];
    if(e){if(p.prov&&e.provs.indexOf(p.prov)<0)e.provs.push(p.prov);return}
    p.provs=p.prov?[p.prov]:[];map[k]=p;P.push(p);
  }
  nat.forEach(function(x){
    if(x.id==='pedro-sanchez')add({tipo:'gob',nombre:x.nombre,wiki:x.wiki,rol:'Presidente del Gobierno de España',pk:'PSOE',nacional:true});
    if(x.estado==='candidato')add({tipo:'cand',nombre:x.nombre,wiki:x.wiki,rol:x.cargo||'Candidato a la presidencia',pk:x.partidoId,nacional:true});
    else if(x.estado==='seguimiento')add({tipo:'seg',nombre:x.nombre,wiki:x.wiki,rol:x.cargo,pk:x.partidoId,nacional:true});
    else if(x.estado==='por_definir')add({tipo:'cand',nombre:null,slot:x.partidoId,rol:x.nota||'Candidatura por definir',pk:x.partidoId,nacional:true});
  });
  var natC={};P.forEach(function(p){if(p.tipo==='cand'&&p.nacional&&p.wiki)natC[p.wiki]=p});
  Object.keys(pp.prov).forEach(function(pc){
    var d=pp.prov[pc];
    d.gobierno.forEach(function(g){add({tipo:'gob',nombre:g.nombre,wiki:g.wiki,rol:g.rol,pk:partyKey(g.partido),prov:pc,amb:g.ambito})});
    d.candidatos.forEach(function(c){var n=c.wiki&&natC[c.wiki];if(n){if(n.provs.indexOf(pc)<0)n.provs.push(pc);return}add({tipo:'cand',nombre:c.nombre,wiki:c.wiki,rol:'Cabeza de lista al Congreso'+(c.nota?' ('+c.nota.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/\[\[|\]\]/g,'')+')':''),pk:c.partido,prov:pc})});
  });
  P.forEach(function(p){p.risk=riskOf(p);p.id='p'+Math.random().toString(36).slice(2,9)});
  $('ft').innerHTML+=Object.keys(prov).sort(function(x,y){return prov[x].localeCompare(prov[y],'es')}).map(function(c){return '<option value="'+c+'">'+esc(prov[c])+'</option>'}).join('');
  var pk={};P.forEach(function(p){if(p.pk)pk[p.pk]=1});
  $('fp').innerHTML+=Object.keys(pk).sort(function(x,y){return (PORDER.indexOf(x)+99)%99-(PORDER.indexOf(y)+99)%99}).map(function(k){return '<option value="'+esc(k)+'">'+esc(PNAME[k]||k)+'</option>'}).join('');
  readUrl();try{buildElect(a[7],a[8])}catch(e){EL={}}
  $('foot').innerHTML='Esta etiqueta <b>no valora a la persona</b>: describe cuánta cobertura de prensa recibe en los titulares recogidos. <b>Neutro</b> si no hay menciones; <b>Con cobertura</b> si aparece en titulares; <b>Cobertura de riesgo</b> si 2 a 5 titulares traen hechos de riesgo (por ejemplo detenciones, imputaciones o accidentes, según palabras clave o la clasificación automática); <b>Alta cobertura de riesgo</b> a partir de 6. Un titular de riesgo no implica responsabilidad de la persona citada. Tuits y redes aún no están conectados. Cargos: Wikidata ('+esc(pp.actualizado||'')+'). Candidatos: <a href="https://es.wikipedia.org/wiki/Elecciones_generales_de_Espa%C3%B1a_de_2026" target="_blank" rel="noopener">Wikipedia</a>. Fotos: Wikipedia / Wikimedia Commons. Verifica antes de usar.'+ELNOTE;
  render();
});

function riskOf(p){return PE.riskOf(p,news)}

/* fotos: Wikipedia REST, solo cuando la tarjeta entra en pantalla */
var io=window.IntersectionObserver?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);photo(e.target)}})},{rootMargin:'200px'}):null;
function photo(el){
  var w=el.dataset.wiki;if(!w)return;
  PE.photoUrl(w).then(function(u){if(u)el.innerHTML='<img src="'+esc(u)+'" alt="'+esc(el.dataset.n+(el.dataset.r?', '+el.dataset.r:''))+'" loading="lazy">'});
}
/* busqueda: todas las palabras deben aparecer en nombre, partido, cargo o territorio; con "t:" se busca en los titulares de la persona */
function qmatch(p,q){
  var inT=/^t:/.test(q);if(inT)q=q.slice(2).trim();if(!q)return true;
  var hay=inT?norm((p.risk.ts||[]).join(' ')):norm([p.nombre,PNAME[p.pk],p.pk,p.rol,terr(p)].join(' '));
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0});
}
function lowS(p){
  var c=!p.nacional&&p.provs.length===1&&p.provs[0],n=c?(pvN[c]||0):0;
  return c&&n<40?'<div class="hl" style="color:var(--warn)" title="Pocos titulares recogidos en esta provincia: la ausencia de cobertura aquí no es una señal fiable.">⚠ Muestra baja: '+n+' titulares en la provincia</div>':'';
}
function nivel(p){return p.nacional?'nacional':p.amb?{'autonómico':'autonómico','provincial':'provincial','municipal':'municipal'}[p.amb]||'':p.tipo==='cand'?'circ':''}
function cargo(p){var r=norm(p.rol||'');return /^presidente|^diputado\/a general/.test(r)?'pres':/^alcalde/.test(r)?'alc':p.tipo==='gob'?'':'cand'}
function tonoK(p){var t=p.risk.tono;return t==null?'nd':t<=-0.3?'neg':t>=0.3?'pos':'neu'}
/* cobertura de los ultimos 14 dias + tendencia (7 d frente a los 7 anteriores) */
function dias(p){
  var now=new Date(),b=[],i;for(i=0;i<14;i++)b.push(0);
  var t0=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  (p.risk.fechas||[]).forEach(function(f){var d=Math.floor((t0-Date.UTC(+f.slice(0,4),+f.slice(5,7)-1,+f.slice(8,10)))/864e5);if(d>=0&&d<14)b[13-d]++});
  return b;
}
function spark(p){
  var b=dias(p),m=Math.max.apply(null,b),tot=b.reduce(function(s,x){return s+x},0);if(!tot)return '';
  var a=b.slice(7).reduce(function(s,x){return s+x},0),pr=b.slice(0,7).reduce(function(s,x){return s+x},0);
  var tr=pr>=3?(a>pr*1.25?['▲','var(--bad)','sube']:a<pr*0.75?['▼','var(--ok)','baja']:['■','var(--mut)','estable']):null;
  var svg='<svg class="sp" width="84" height="16" viewBox="0 0 84 16" role="img" aria-label="Titulares por día, últimos 14 días">'+b.map(function(x,i){var h=x?Math.max(2,Math.round(x/m*16)):1;return '<rect x="'+(i*6)+'" y="'+(16-h)+'" width="5" height="'+h+'" rx="1" fill="'+(x?'var(--acc)':'#1f2937')+'"><title>'+x+' titular'+(x===1?'':'es')+'</title></rect>'}).join('')+'</svg>';
  return '<div class="hl" title="Titulares por día en los últimos 14 días ('+tot+' en total)">'+svg+(tr?' <span class="tr" style="color:'+tr[1]+'" title="Últimos 7 días ('+a+') frente a los 7 anteriores ('+pr+')">'+tr[0]+' '+tr[2]+'</span>':'')+'</div>';
}
function terr(p){
  if(p.nacional)return 'Ámbito nacional';
  if(p.amb==='autonómico'&&p.provs.length)return 'Comunidad · '+p.provs.map(function(c){return prov[c]}).slice(0,3).join(', ')+(p.provs.length>3?'…':'');
  return p.provs.map(function(c){return prov[c]}).slice(0,3).join(', ')+(p.provs.length>3?'…':'');
}
var kind='',vista='',sk='',sd=1;
function readUrl(){
  var h=location.hash.slice(1),o={};
  if(/^\d\d$/.test(h))o.prov=h;else h.split('&').forEach(function(x){var i=x.indexOf('=');if(i>0)o[x.slice(0,i)]=decodeURIComponent(x.slice(i+1).replace(/\+/g,' '))});
  $('ft').value=o.prov&&prov[o.prov]?o.prov:'';
  $('fp').value=o.partido&&$('fp').querySelector('option[value="'+o.partido.replace(/"/g,'')+'"]')?o.partido:'';
  $('q').value=o.q||'';
  ['fn','fc','fm'].forEach(function(id,i){var k=['nivel','cargo','tono'][i];$(id).value=o[k]&&$(id).querySelector('option[value="'+o[k].replace(/"/g,'')+'"]')?o[k]:''});
  $('fo').value=/^(name|party)$/.test(o.orden||'')?o.orden:'risk';
  kind=/^(gob|cand)$/.test(o.tipo||'')?o.tipo:'';vista=o.vista==='tabla'?'tabla':'';
  document.querySelectorAll('.seg:not(#vw) button').forEach(function(x){x.classList.toggle('on',x.dataset.k===kind)});
  document.querySelectorAll('#vw button').forEach(function(x){x.classList.toggle('on',x.dataset.v===vista)});
}
function writeUrl(){
  var o=[['prov',$('ft').value],['partido',$('fp').value],['nivel',$('fn').value],['cargo',$('fc').value],['tono',$('fm').value],['tipo',kind],['q',$('q').value.trim()],['orden',$('fo').value==='risk'?'':$('fo').value],['vista',vista]].filter(function(x){return x[1]});
  try{history.replaceState(null,'',location.pathname+location.search+(o.length?'#'+o.map(function(x){return x[0]+'='+encodeURIComponent(x[1])}).join('&'):''))}catch(e){}
}
var cur=[],cnt={},sel=[];
/* ---------- probabilidad de escaño (orientativa) ----------
   Votos de 2023 por circunscripción x cambio de cada partido entre su resultado nacional de 2023 y la media de encuestas
   (swing nacional uniforme), con ruido aleatorio (nacional y provincial) y Ley d'Hondt con barrera del 3 %. */
var EL={},ELINFO=null;
var ELNOTE=' <b>Probabilidad de escaño</b>: estimación orientativa solo para cabezas de lista de PP, PSOE, VOX y Frente Amplio (este último comparado con Sumar y Podemos en 2023). Parte de los votos de 2023 en cada circunscripción, aplica el cambio nacional de la media de encuestas (sin CIS, últimos 30 días) y simula 400 variaciones aleatorias con la Ley d’Hondt y barrera del 3 %. No usa encuestas provinciales y no es una predicción; es la probabilidad de que su partido obtenga al menos un escaño.';
var PK2R={PP:'PP',PSOE:'PSOE',VOX:'VOX',FA:'SUMAR',ERC:'ERC',JUNTS:'JxCAT - JUNTS',PNV:'EAJ-PNV',BNG:'B.N.G.',EHB:'EH Bildu',CC:'CCa'};
var MODEL={PP:1,PSOE:1,VOX:1,SUMAR:1};
function dh(v,m,min){var q=[],k;for(k in v){if(v[k]<min)continue;for(var i=1;i<=m;i++)q.push([v[k]/i,k])}q.sort(function(a,b){return b[0]-a[0]});var r={};q.slice(0,m).forEach(function(x){r[x[1]]=(r[x[1]]||0)+1});return r}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildElect(res,enc){
  EL={};ELINFO=null;if(!res||!enc||!res.prov)return;
  var pr=res.prov,codes=Object.keys(pr),tot=0,sums={};
  codes.forEach(function(c){tot+=pr[c].validos;for(var k in pr[c].v)sums[k]=(sums[k]||0)+pr[c].v[k][0]});
  var sh=function(k){return (sums[k]||0)/tot*100};
  var ps=(enc.encuestas||[]).filter(function(x){return x.voto&&!/cis/i.test(x.empresa||'')&&x.fecha});if(!ps.length)return;
  ps.sort(function(a,b){return b.fecha<a.fecha?-1:1});var last=new Date(ps[0].fecha);
  ps=ps.filter(function(x){return (last-new Date(x.fecha))/864e5<=30});
  var acc={},wt={};ps.forEach(function(x){var w=Math.sqrt(x.muestra||1000);for(var k in x.voto){acc[k]=(acc[k]||0)+x.voto[k]*w;wt[k]=(wt[k]||0)+w}});
  var poll={};for(var k in acc)poll[k]=acc[k]/wt[k];
  if(!poll.PP||!poll.PSOE||!poll.VOX)return;
  var tgt={PP:poll.PP,PSOE:poll.PSOE,VOX:poll.VOX,SUMAR:(poll.SUMAR||0)+(poll.PODEMOS||0)},rat={},used=0,old=0;
  for(k in tgt){rat[k]=tgt[k]/Math.max(sh(k),.1);used+=tgt[k];old+=sh(k)}
  var ro=Math.max(.2,Math.min(3,(100-used)/Math.max(100-old,1)));
  ELINFO={n:ps.length,fecha:ps[0].fecha};
  codes.forEach(function(c){
    var d=pr[c],m=0,keys=Object.keys(d.v);keys.forEach(function(k){m+=d.v[k][1]});if(!m)return;
    var rnd=mulberry(parseInt(c,10)*7919+13),gauss=function(){return Math.sqrt(-2*Math.log(1-rnd()))*Math.cos(2*Math.PI*rnd())};
    var run=function(sn,sp){var v={},tv=d.validos;keys.forEach(function(k){var x=d.v[k][0],r=MODEL[k]?rat[k]:ro;if(sn)r*=Math.exp(sn*(MODEL[k]?G[k]:0));if(sp)r*=Math.exp(sp*gauss());v[k]=x*r;tv+=v[k]-x});return dh(v,m,.03*tv)};
    var G={},base=run(0,0),cnt={},n=400,tl={};
    keys.forEach(function(k){cnt[k]=0});
    for(var i=0;i<n;i++){for(var kk in MODEL)G[kk]=gauss();var r=run(.08,.1);for(var k2 in r)cnt[k2]++}
    EL[c]={m:m,t:Object.keys(MODEL).reduce(function(o,k){var x=d.v[k];if(x)o[k]={s23:x[1],p23:x[0]/d.validos*100,est:base[k]||0,prob:cnt[k]/n};return o},{})};
    keys.forEach(function(k){if(!MODEL[k]&&!EL[c].t[k])EL[c].t[k]={s23:d.v[k][1],p23:d.v[k][0]/d.validos*100,est:null,prob:null}});
  });
}
function elOf(p){if(p.tipo!=='cand'||p.nacional||p.provs.length!==1)return null;var e=EL[p.provs[0]],k=PK2R[p.pk];return e&&k&&e.t[k]?{m:e.m,d:e.t[k]}:null}
function elLine(p){
  var e=elOf(p);if(!e)return '';var d=e.d,h23=d.s23+' de '+e.m+' escaños en 2023 ('+d.p23.toFixed(1)+' % de los votos)';
  if(d.prob==null)return '<div class="hl" title="Sin estimación para este partido.">🗳 '+h23+'</div>';
  var pc=Math.round(d.prob*100),c=pc>=80?'var(--ok)':pc>=40?'var(--warn)':'var(--mut)';
  return '<div class="hl" title="Probabilidad orientativa de que su partido obtenga al menos un escaño en esta circunscripción (como cabeza de lista ocuparía el primero). Estimación central: '+d.est+' de '+e.m+'. Ver nota al pie.">🗳 Escaño: <b style="color:'+c+'">~'+pc+' %</b> · '+h23+'</div>';
}
/* ---------- mapa ---------- */
var map=null,layer=null,gjProv=null;
var key=function(p){return p.tipo+'|'+(p.wiki||p.nombre||p.slot)+'|'+p.pk};
function colorMap(){
  if(!layer)return;
  var mx=Math.max.apply(null,Object.keys(cnt).map(function(c){return cnt[c]}).concat([1]));
  layer.eachLayer(function(l){
    var c=l.feature.properties.c,n=cnt[c]||0,on=$('ft').value===c;
    l.setStyle({fillColor:n?'rgb('+Math.round(14+(34-14)*n/mx)+','+Math.round(40+(211-40)*n/mx)+','+Math.round(60+(238-60)*n/mx)+')':'#222a36',fillOpacity:.9,color:on?'#fff':'#0b0f15',weight:on?2.5:.6});
    l.setTooltipContent('<b>'+esc(prov[c])+'</b><br>'+n+' político'+(n===1?'':'s')+' con el filtro actual');
  });
  $('mpl').textContent=$('ft').value?'Filtrando por '+prov[$('ft').value]+'. Pulsa de nuevo esa provincia, o el mar, para quitar el filtro.':'Color = número de políticos con los filtros actuales (sin contar el de provincia).';
}
function initMap(){
  if(map||!window.L)return;
  map=L.map('map',{zoomControl:false,minZoom:4,zoomSnap:.25});L.control.zoom({position:'bottomright'}).addTo(map);
  map.attributionControl.addAttribution('Límites: IGN / Opendatasoft');
  fetch('../data/provincias.geojson').then(function(r){return r.json()}).then(function(gj){
    layer=L.geoJSON(gj,{style:{fillColor:'#222a36',fillOpacity:.9,color:'#0b0f15',weight:.6},onEachFeature:function(f,l){
      l.bindTooltip('');
      l.on('click',function(e){L.DomEvent.stopPropagation(e);var c=f.properties.c;$('ft').value=$('ft').value===c?'':c;render()});
    }}).addTo(map);
    map.fitBounds([[35.9,-9.6],[43.9,4.6]],{padding:[10,10]});
    map.on('click',function(){if($('ft').value){$('ft').value='';render()}});
    colorMap();
  });
}
$('mp').addEventListener('toggle',function(){if($('mp').open){initMap();setTimeout(function(){if(map)map.invalidateSize()},50)}});
/* ---------- comparador ---------- */
function cbar(){$('cbar').classList.toggle('on',sel.length>0);$('cn').textContent=sel.length+' seleccionado'+(sel.length===1?'':'s')+' (máx. 3)';$('cgo').disabled=sel.length<2}
function cmpView(){
  var ps=sel.map(function(k){return P.filter(function(p){return key(p)===k})[0]}).filter(Boolean),el=$('cmpv');
  if(ps.length<2){el.hidden=true;return}
  var rows=[['Partido',function(p){return PNAME[p.pk]||p.pk||''}],['Cargo',function(p){return p.rol||''}],['Territorio',terr],['Tipo',function(p){return {gob:'Gobierna hoy',cand:'Candidato 29N',seg:'En seguimiento'}[p.tipo]}],['Titulares',function(p){return p.risk.n}],['De riesgo',function(p){return p.risk.r}],['Prob. de escaño',function(p){var e=elOf(p);return e&&e.d.prob!=null?'~'+Math.round(e.d.prob*100)+' % (2023: '+e.d.s23+' de '+e.m+')':'—'}],['Cobertura (0-100)',function(p){return p.risk.score}],['Tono medio',function(p){return p.risk.nt?(p.risk.tono>0?'+':'')+p.risk.tono.toFixed(1)+' ('+p.risk.nt+' titulares)':'sin datos'}],['Últimos 14 días',function(p){return p.risk.n?spark(p).replace('class="hl"','style="font-size:12px"'):'—'}],['Último titular',function(p){return p.risk.n?'<a href="'+esc(p.risk.last.u)+'" target="_blank" rel="noopener">'+esc(cleanTitle(p.risk.last.t).slice(0,100))+'</a>':'—'}],['Ficha',function(p){var u=fichaUrl(p);return u?'<a class="fl" href="'+u+'">Ver ficha →</a>':'—'}]];
  var raw={'Últimos 14 días':1,'Último titular':1,'Ficha':1};
  el.innerHTML='<table><thead><tr><th></th>'+ps.map(function(p){return '<th style="color:var(--txt);font-size:14px;font-family:Inter,sans-serif;text-transform:none">'+esc(p.nombre||'Por definir')+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr><th>'+r[0]+'</th>'+ps.map(function(p){var v=r[1](p);return '<td>'+(raw[r[0]]?v:esc(v))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table><button class="btn" id="cclose" type="button" style="margin-top:8px">Cerrar comparación</button>';
  el.hidden=false;$('cclose').onclick=function(){el.hidden=true};el.scrollIntoView({block:'nearest'});
}
$('out').addEventListener('change',function(e){var t=e.target;if(!t.matches||!t.matches('input.cc'))return;var k=t.dataset.k,i=sel.indexOf(k);
  if(t.checked){if(sel.length>=3){t.checked=false;return}if(i<0)sel.push(k)}else if(i>=0)sel.splice(i,1);cbar();if(!$('cmpv').hidden)cmpView()});
$('cgo').onclick=cmpView;$('cclr').onclick=function(){sel=[];$('cmpv').hidden=true;cbar();render()};
function render(){
  var q=norm($('q').value.trim()),ft=$('ft').value,fp=$('fp').value,fo=$('fo').value;
  var base=P.filter(function(p){
    if(kind&&p.tipo!==kind&&!(kind==='cand'&&p.tipo==='seg'))return false;
    if(fp&&p.pk!==fp&&!(fp==='FA'&&p.pk==='FA/PODEMOS'))return false;
    if(q&&!qmatch(p,q))return false;
    if($('fn').value&&nivel(p)!==$('fn').value)return false;
    if($('fc').value&&cargo(p)!==$('fc').value)return false;
    if($('fm').value&&tonoK(p)!==$('fm').value)return false;
    return true;
  });
  var ls=base.filter(function(p){return !ft||p.provs.indexOf(ft)>=0||(p.nacional&&p.tipo==='gob')});
  cnt={};base.forEach(function(p){p.provs.forEach(function(c){cnt[c]=(cnt[c]||0)+1})});colorMap();
  ls.sort(function(a,b){
    if(fo==='name')return (a.nombre||'~').localeCompare(b.nombre||'~','es');
    if(fo==='party')return (PORDER.indexOf(a.pk)+99)%99-(PORDER.indexOf(b.pk)+99)%99||(a.nombre||'').localeCompare(b.nombre||'','es');
    return b.risk.score-a.risk.score||(a.nombre||'~').localeCompare(b.nombre||'~','es');
  });
  cur=ls;writeUrl();
  var withInfo=ls.filter(function(p){return p.risk.n}).length;
  $('kp').innerHTML=[[ls.length,'Políticos en el filtro'],[ls.filter(function(p){return p.tipo==='gob'}).length,'Gobiernan hoy'],[ls.filter(function(p){return p.tipo==='cand'}).length,'Candidatos 29N'],[withInfo,'Con titulares (resto: Neutro)']].map(function(k){return '<div class="kpi"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'}).join('');
  var groups=[['gob','Gobiernan hoy'],['cand','Candidatos a las elecciones del 29 de noviembre'],['seg','En seguimiento']],h='';
  groups.forEach(function(g){
    var gl=ls.filter(function(p){return p.tipo===g[0]});if(!gl.length)return;
    if(!vista)h+='<details class="g" data-g="'+g[0]+'"'+(closed[g[0]]?'':' open')+'><summary class="dg">'+g[1]+' · '+gl.length+'</summary><div class="grid">'+gl.map(card).join('')+'</div></details>';
  });
  if(vista&&ls.length)h=table(ls);
  $('out').innerHTML=h||'<div class="empty">Sin resultados con estos filtros.</div>';
  document.querySelectorAll('.big[data-wiki]').forEach(function(el){if(io)io.observe(el);else photo(el)});
}
var STC={crisis:'var(--bad)',press:'var(--warn)',focus:'var(--acc)',none:'var(--mut)'};
function card(p){
  var r=p.risk,col=PCOL[p.pk]||'#94a3b8',c=STC[r.k];
  return '<div class="pc"><div class="big" data-wiki="'+esc(p.wiki||'')+'" data-n="'+esc(p.nombre||'')+'" data-r="'+esc(p.rol||'')+'" style="border-color:'+col+'">'+esc(p.nombre?initials(p.nombre):'?')+'</div><div style="min-width:0">'+
    '<b>'+esc(p.nombre||'Por definir')+'</b><div class="rol">'+esc(p.rol||'')+' · <span style="color:'+col+'">'+esc(PNAME[p.pk]||p.pk||'')+'</span></div><div class="terr">'+esc(terr(p))+'</div>'+lowS(p)+elLine(p)+
    '<div class="risk"><span class="st" style="color:'+c+'">'+r.label+'</span>'+(r.n?'<div class="bar"><i style="width:'+r.score+'%;background:'+c+'"></i></div><span>'+r.score+'</span>'+(r.nt?'<span title="Tono medio de '+r.nt+' titulares donde aparece (orientativo: el modelo valora la noticia, no a la persona)">· tono '+(r.tono>0?'+':'')+r.tono.toFixed(1)+'</span>':''):'<span style="color:var(--mut)">sin información</span>')+'</div>'+
    (r.n?spark(p):'')+
    (r.n?'<div class="hl">'+r.n+' titular'+(r.n>1?'es':'')+(r.r?' · '+r.r+' de riesgo':'')+' · <a href="'+esc(r.last.u)+'" target="_blank" rel="noopener">'+esc(cleanTitle(r.last.t).slice(0,90))+'</a></div>':'')+
    '<div class="hl">'+(fichaUrl(p)?'<a class="fl" href="'+fichaUrl(p)+'">Ver ficha →</a>'+(p.wiki?' · ':''):'')+(p.wiki?'<a href="https://es.wikipedia.org/wiki/'+encodeURIComponent(p.wiki)+'" target="_blank" rel="noopener">Wikipedia</a>':'')+'</div>'+(p.nombre?'<label class="cmp"><input class="cc" type="checkbox" data-k="'+esc(key(p))+'"'+(sel.indexOf(key(p))>=0?' checked':'')+'> Comparar</label>':'')+'</div></div>';
}
var COLS=[['nombre','Nombre',function(p){return p.nombre||'Por definir'}],['partido','Partido',function(p){return PNAME[p.pk]||p.pk||''}],['cargo','Cargo',function(p){return p.rol||''}],['territorio','Territorio',terr],['tipo','Tipo',function(p){return {gob:'Gobierna hoy',cand:'Candidato 29N',seg:'En seguimiento'}[p.tipo]||p.tipo}],['titulares','Titulares',function(p){return p.risk.n}],['score','Cobertura',function(p){return p.risk.score}],['tono','Tono',function(p){return p.risk.nt?+p.risk.tono.toFixed(1):''}],['esc','Prob. escaño (%)',function(p){var e=elOf(p);return e&&e.d.prob!=null?Math.round(e.d.prob*100):''}],['esc23','Escaños 2023 (partido)',function(p){var e=elOf(p);return e?e.d.s23+' de '+e.m:''}]];
function table(ls){
  var c=COLS.filter(function(x){return x[0]===sk})[0];
  if(c)ls=ls.slice().sort(function(a,b){var x=c[2](a),y=c[2](b);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'es'))*sd});
  return '<div class="tbw"><table class="tb"><thead><tr>'+COLS.map(function(x){return '<th data-s="'+x[0]+'" tabindex="0" role="columnheader" aria-sort="'+(x[0]===sk?(sd>0?'ascending':'descending'):'none')+'"'+(x[0]===sk?' class="on"':'')+'>'+x[1]+(x[0]===sk?(sd>0?' ▲':' ▼'):'')+'</th>'}).join('')+'<th style="cursor:default">Ficha</th></tr></thead><tbody>'+ls.map(function(p){
    var f=fichaUrl(p);return '<tr>'+COLS.map(function(x,i){var v=x[2](p);return '<td>'+(i===0&&f?'<a class="fl" href="'+f+'">'+esc(v)+'</a>':esc(v))+'</td>'}).join('')+'<td>'+(f?'<a href="'+f+'">Ver</a>':'')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function csv(){
  var q=function(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[COLS.map(function(x){return x[1]}).concat(['Wikipedia','Ficha']).join(',')].concat(cur.map(function(p){
    return COLS.map(function(x){return q(x[2](p))}).concat([q(p.wiki?'https://es.wikipedia.org/wiki/'+encodeURIComponent(p.wiki):''),q(fichaUrl(p)?new URL(fichaUrl(p),location.href).href:'')]).join(',')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='atalaya-politicos-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
$('csv').onclick=csv;
$('out').addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('th[data-s]');if(!t)return;var k=t.dataset.s;if(sk===k)sd=-sd;else{sk=k;sd=1}render()});
document.querySelectorAll('#vw button').forEach(function(b){b.onclick=function(){vista=b.dataset.v;document.querySelectorAll('#vw button').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
$('out').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('th[data-s]')){e.preventDefault();e.target.click()}});
$('out').addEventListener('toggle',function(e){if(e.target.dataset&&e.target.dataset.g)closed[e.target.dataset.g]=!e.target.open},true);
window.addEventListener('hashchange',function(){readUrl();render()});
['q','ft','fp','fo','fn','fc','fm'].forEach(function(id){$(id).addEventListener('input',render)});
document.querySelectorAll('.seg:not(#vw) button').forEach(function(b){b.onclick=function(){kind=b.dataset.k;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
})();

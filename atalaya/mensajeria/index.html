<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajería | Atalaya</title>
<meta name="description" content="Qué publican los partidos en sus canales públicos de Telegram: ritmo, formatos y visualizaciones, con la lista de canales de WhatsApp y de partidos sin canal confirmado.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://emirodgar.es/atalaya/mensajeria/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/atalaya/assets/shell.css">
<link rel="stylesheet" href="/atalaya/assets/fonts.css">
<style>
:root{--bg:#07090d;--panel:#0e1219;--panel2:#131a24;--line:#1f2937;--txt:#e5e9f0;--mut:#8b97a8;--acc:#22d3ee;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:inherit}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;min-height:56px;border-bottom:1px solid var(--line);background:#05070a;position:sticky;top:0;z-index:1000}
.pt{font-size:18px;font-weight:700}.pt small{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
.tagline{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600}
.kpi span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 16px 0}
.card>h2{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.body{padding:12px 14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.r{cursor:pointer}tr.r:hover,tr.r.on{background:var(--panel2)}
tr.r:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--mut);margin-left:6px}
.stk{display:flex;height:10px;width:140px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.stk i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.hl{list-style:none}.hl li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;font-size:13px}
.hl li:last-child{border:0}.hl .d{font-family:var(--mono);font-size:12px;color:var(--mut);flex:none;width:92px}
.hl a{text-decoration:none}.hl a:hover{text-decoration:underline}
.hl small{color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 16px 24px}
.two .card{margin:0}
ul.p{list-style:none}ul.p li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}ul.p li:last-child{border:0}
.empty{padding:18px 14px;color:var(--mut)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="/atalaya/assets/shell.js?v=5"></script>
<header class="top">
  <h1 class="pt">Mensajería <small>canales públicos de Telegram de los partidos</small></h1>
  <span class="tagline">Inteligencia electoral</span>
</header>

<section class="kpis" id="kpis" aria-label="Resumen"></section>

<section class="card">
  <h2><span>Canales leídos</span><span id="cnt"></span></h2>
  <div class="tw"><table id="tb"></table></div>
  <div class="body" style="border-top:1px solid var(--line)"><div class="leg" id="leg"></div><p class="note" id="nt"></p></div>
</section>

<section class="card" id="det" hidden>
  <h2><span>Últimos mensajes <em id="dt" style="font-style:normal;color:var(--acc)"></em></span></h2>
  <div class="body" id="spk" style="border-bottom:1px solid var(--line)"></div>
  <ul class="hl body" id="dl"></ul>
</section>

<div class="two">
  <section class="card"><h2><span>Canales de WhatsApp</span></h2><div class="body"><p class="note" style="margin:0 0 8px">WhatsApp no ofrece API ni RSS: se listan los que enlaza la web de cada partido, sin lectura automática.</p><ul class="p" id="wa"></ul></div></section>
  <section class="card"><h2><span>Sin canal confirmado</span></h2><div class="body"><ul class="p" id="sin"></ul></div></section>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var f0=function(x){return x==null?'—':Math.round(x).toLocaleString('es-ES')};
var f1=function(x){return x==null?'—':x.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})};
var COL={PP:'#3b9cff',PSOE:'#ef4444',Vox:'#7ac943',Podemos:'#9b59d0',Sumar:'#d6246e',Junts:'#00c3b2',PNV:'#4ade80','EH Bildu':'#2dd4bf',BNG:'#76b2e1',UPN:'#f59e0b',ERC:'#f95838',SALF:'#e11d48'};
var FC={'imagen':'#22d3ee','vídeo':'#a78bfa','texto':'#94a3b8','enlace':'#fbbf24','audio':'#34d399','encuesta':'#f472b6','documento':'#fb923c'};
var FMT=['imagen','vídeo','enlace','texto','audio','encuesta','documento'];
var sel=null,D=null;

Promise.all([
  fetch('../data/mensajeria.json').then(function(r){return r.json()}),
  fetch('../data/canales_mensajeria.json').then(function(r){return r.json()})
]).then(function(r){
  D=r[0];var C=r[1];
  render();
  $('wa').innerHTML=C.canales.filter(function(c){return c.plataforma==='whatsapp'}).map(function(c){return '<li><b>'+esc(c.partido)+'</b> · <a href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">canal de WhatsApp</a></li>'}).join('')||'<li>Ninguno.</li>';
  var pend=C.canales.filter(function(c){return c.lectura==='pendiente_confirmar'}).map(function(c){return '<li><b>'+esc(c.partido)+'</b> · <span style="color:var(--mut)">'+esc(c.nota||'Pendiente de confirmar')+'</span></li>'});
  $('sin').innerHTML=pend.concat((C.sin_canal_confirmado||[]).map(function(s){return '<li><b>'+esc(s.partido)+'</b> · <span style="color:var(--mut)">'+esc(s.motivo)+'</span></li>'})).join('');
}).catch(function(){$('tb').innerHTML='<tr><td class="empty">No se pudieron leer los datos.</td></tr>'});

function render(){
  var L=D.canales.slice().sort(function(a,b){return b.ventana.por_dia-a.ventana.por_dia});
  var msg=L.reduce(function(a,c){return a+c.ventana.mensajes},0),subs=L.reduce(function(a,c){return a+(c.seguidores||0)},0);
  var top=L[0];
  $('kpis').innerHTML=
    k(L.length,'Canales leídos','de partidos con canal público de Telegram')+k(f0(msg),'Mensajes en '+D.ventana_dias+' días','suma de los canales')+
    k(f0(subs),'Seguidores','suma; un mismo usuario puede seguir varios')+k(top?top.partido:'—','Más activo',top?f1(top.ventana.por_dia)+' mensajes al día':'');
  $('cnt').textContent=L.length+' canales · actualizado '+String(D.actualizado).slice(0,10);
  var h='<thead><tr><th>Partido</th><th class="n">Seguidores</th><th class="n">Mensajes/día</th><th class="n">Vistas (mediana)</th><th class="n">Vistas/seguidor</th><th>Formatos</th><th>Último</th></tr></thead><tbody>';
  L.forEach(function(c){
    var v=c.ventana,tot=FMT.reduce(function(a,f){return a+(v.formatos[f]||0)},0);
    h+='<tr class="r'+(sel===c.handle?' on':'')+'" tabindex="0" data-h="'+esc(c.handle)+'"><td><span class="dot" style="background:'+(COL[c.partido]||'#94a3b8')+'"></span>'+esc(c.partido)+'<span class="tag">@'+esc(c.handle)+'</span>'+(c.origen!=='enlazado_web'?'<span class="tag" title="No lo enlaza la web del partido; parece oficial pero conviene confirmarlo">sin confirmar</span>':'')+'</td>'+
      '<td class="n">'+f0(c.seguidores)+'</td><td class="n">'+f1(v.por_dia)+'</td><td class="n">'+f0(v.vistas_mediana)+'</td><td class="n">'+(v.vistas_por_seguidor==null?'—':f1(v.vistas_por_seguidor*100)+' %')+'</td>'+
      '<td><div class="stk" title="'+esc(JSON.stringify(v.formatos))+'">'+FMT.map(function(f){var n=v.formatos[f]||0;return n?'<i style="width:'+(n*100/tot).toFixed(1)+'%;background:'+FC[f]+'"></i>':''}).join('')+'</div></td>'+
      '<td>'+esc(c.ultimo||'—')+'</td></tr>';
  });
  $('tb').innerHTML=h+'</tbody>';
  Array.prototype.forEach.call($('tb').querySelectorAll('tr.r'),function(tr){
    var go=function(){sel=tr.dataset.h;render();detail()};
    tr.onclick=go;tr.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
  $('leg').innerHTML=FMT.map(function(f){return '<span><i style="background:'+FC[f]+'"></i>'+f+'</span>'}).join('');
  $('nt').textContent='Canales públicos de Telegram que enlaza la web de cada partido, más los marcados «sin confirmar» (como el de Alvise Pérez, líder de SALF: es un canal personal que el partido usa como vía principal). Las visualizaciones son las de la primera captura de cada mensaje, así que los más recientes pueden estar infravalorados. Un mensaje puede tener más de un formato. No mide apoyo ni alcance total, y la ausencia de un partido aquí significa que no hay canal confirmado, no que no comunique por Telegram.';
  if(sel)detail();else $('det').hidden=true;
}
function k(b,s,sm){return '<div class="kpi"><b>'+b+'</b><span>'+s+'</span><small>'+sm+'</small></div>'}
function detail(){
  var c=D.canales.filter(function(x){return x.handle===sel})[0];if(!c){$('det').hidden=true;return}
  $('det').hidden=false;$('dt').textContent='· '+c.partido;
  var s=c.ventana.serie||[],mx=Math.max.apply(null,s.map(function(x){return x.n}).concat([1]));
  $('spk').innerHTML=s.length?'<div class="note" style="margin:0 0 6px">Mensajes por día ('+c.ventana.mensajes+' en '+c.ventana.dias+' días; archivados desde '+esc(c.primero||'—')+': '+f0(c.mensajes_archivados)+')</div><svg viewBox="0 0 '+(s.length*14)+' 44" width="100%" height="56" preserveAspectRatio="none" role="img" aria-label="Mensajes por día">'+s.map(function(x,i){var hh=Math.max(2,x.n/mx*40);return '<rect x="'+(i*14+2)+'" y="'+(42-hh)+'" width="10" height="'+hh+'" rx="2" fill="'+(COL[c.partido]||'#94a3b8')+'"><title>'+x.f+': '+x.n+'</title></rect>'}).join('')+'</svg>':'<p class="note" style="margin:0">Sin mensajes en la ventana.</p>';
  $('dl').innerHTML=c.ultimos.map(function(m){return '<li><span class="d">'+esc(m.f.slice(0,10))+'</span><span><a href="'+esc(m.u)+'" target="_blank" rel="noopener noreferrer">'+esc(m.t||'(sin texto)')+'</a> <small>· '+esc(m.fmt.join(', '))+' · '+f0(m.v)+' vistas</small></span></li>'}).join('');
  $('det').scrollIntoView({block:'nearest',behavior:'smooth'});
}
})();
</script>
</body>
</html>

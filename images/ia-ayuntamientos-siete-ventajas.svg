<g font-size="13" fill="#4b5563">
<text x="52" y="142">Automatización de</text><text x="52" y="160">documentos, actas</text><text x="52" y="178">e informes</text>
<text x="237" y="142">Chatbots y asistentes</text><text x="237" y="160">virtuales para</text><text x="237" y="178">atender al ciudadano</text>
<text x="422" y="142">Análisis de datos y</text><text x="422" y="160">predicción de</text><text x="422" y="178">necesidades</text>
<text x="607" y="142">Prevención y alerta</text><text x="607" y="160">temprana ante</text><text x="607" y="178">emergencias</text>
<text x="144.5" y="282">Información pública</text><text x="144.5" y="300">y participación</text><text x="144.5" y="318">ciudadana</text>
<text x="329.5" y="282">Energía, residuos y</text><text x="329.5" y="300">calidad del aire y</text><text x="329.5" y="318">del agua</text>
<text x="514.5" y="282">Trámites digitales y</text><text x="514.5" y="300">modernización de la</text><text x="514.5" y="318">administración</text>

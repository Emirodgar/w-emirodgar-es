<text x="82" y="111">Eficiencia</text>
<text x="267" y="111">Atención 24/7</text>
<text x="452" y="111">Decisiones</text>
<text x="637" y="111">Seguridad</text>
<text x="174.5" y="251">Transparencia</text>
<text x="359.5" y="251">Sostenibilidad</text>
<text x="544.5" y="251">Digitalización</text>
